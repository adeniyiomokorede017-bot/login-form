<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <div class="general-div">
        <div class="purple-div">
            <h2 class="mofe">MOFEVIA</h2>
            <p class="back">Welcome back to Mofevia</p>
            <p class="space">A space where creativity meets possibility.</p>
            <div class="visual">
                <span class="sparkle sparkle-1">✦</span>
                <span class="sparkle sparkle-2">✦</span>
                <span class="sparkle sparkle-3">✦</span>
                <span class="heart">&hearts;</span>
                <span class="sparkle sparkle-4">✦</span>
                <span class="sparkle sparkle-5">✦</span>
            </div>
        </div>

        <div class="white-div">
            <h1 class="h1">Login</h1>
            <p class="welcome">Welcome back! Login to continue</p>
            <h4 class="h3">Email Address</h4>
            <input class="input" type="text" placeholder="&#9993;">
            <h4 class="h4">Password</h4>
            <div class="eyes">
                <button class="dot">
                    <p>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</p>
                    <p>&#x1F441;</p>
                 
                </button> 
            </div>
        
            <div class="check-div">           
                 <button class="check-mark">&check;</button>
                <h5 class="remember">Remember me</h5>
                <h5 class="forgot">Forgot password?</h5>
            </div>
            <button class="login">Login</button>
            <p class="or">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&ndash; <strong>OR</strong> &mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&ndash;</p>

            <div class="img-div">
              <button class="google">
                <img class="google-logo" src="google-logo.png">
                <p class="continue">continue with Google</p>
              </button>
            </div>
            <p class="dont">Don't have an account? <span class="sign-up">Sign up</span></p>

        </div>
    </div>
</body>
</html>
